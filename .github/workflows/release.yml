name: Release

# Push a tag like v2.1.0 (it must match package.json "version").
# - npm: published here (with provenance)
# - jsDelivr: serves the npm package and the GitHub tag automatically, no step needed
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Tag must match package.json version
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: dist must be committed and up to date
        run: git diff --exit-code -- dist
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: GitHub release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Warm the jsDelivr cache
        run: |
          for f in simpleform.umd.min.js simpleform.css; do
            curl -fsS "https://purge.jsdelivr.net/npm/simpleformjs@latest/dist/$f" >/dev/null || true
          done
